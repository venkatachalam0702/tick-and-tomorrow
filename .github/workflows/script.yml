name: "3. Script (Gate 3 script PR)"
# Starts when a Gate 2 fact-check pull request is merged,
# or by hand from the Actions tab (Run workflow) with an episode folder.
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode folder, e.g. episodes/2026-11-26-how-does-a-microwave-work"
        required: true
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: script
  cancel-in-progress: false
jobs:
  script:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'gate-2-factcheck'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Find the episode folder
        id: ep
        env:
          IN_EPISODE: ${{ inputs.episode }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$IN_EPISODE" ]; then
            ep="${IN_EPISODE%/}"
          else
            ep=$(gh pr diff "$PR" --name-only | grep -E '^episodes/[^/]+/facts\.md$' | head -n 1 | xargs -r dirname)
          fi
          if [ -z "$ep" ] || [ ! -f "$ep/facts.md" ]; then
            echo "::error::No facts.md found for episode '$ep'"; exit 1
          fi
          echo "dir=$ep" >> "$GITHUB_OUTPUT"

      - name: Write and check the script
        id: script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EP: ${{ steps.ep.outputs.dir }}
        run: python -u -m pipeline.script write "$EP"

      - name: Open the script pull request
        env:
          EP: ${{ steps.ep.outputs.dir }}
          WORDS: ${{ steps.script.outputs.words }}
          REPORT: ${{ steps.script.outputs.report }}
          FACT_PR: ${{ github.event.pull_request.number }}
        run: |
          slug=$(basename "$EP")
          title=$(python -c "import yaml,sys; print(yaml.safe_load(open(sys.argv[1]))['title'])" "$EP/topic.yaml")
          branch="script/$slug"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then branch="$branch-${{ github.run_number }}"; fi
          git config user.name "tick-and-tomorrow-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$EP"
          git commit -m "Script: $title"
          git push -u origin "$branch"
          gh label create gate-3-script --color 7B61FF --description "Gate 3: script review" --force
          minutes=$(( (WORDS + 75) / 150 ))
          body=$(printf '%s\n\n%s\n\n%s\n\n%s\n%s\n' \
            "**Gate 3: script review** for _${title}_ (${WORDS} words, about ${minutes} min)" \
            "Open **Files changed** → \`$EP/script.md\`, or open the file on the branch and tap the ✏️ pencil to edit. Review steps are at the top of the file. The checks re-run each time you save an edit." \
            "$REPORT" \
            "Merge this pull request to approve the script." \
            "${FACT_PR:+Facts approved in #$FACT_PR.}")
          pr=$(gh pr create --base main --head "$branch" --title "Gate 3: script \"$title\"" \
                 --body "$body" --label gate-3-script)
          echo "Script PR: $pr" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$FACT_PR" ]; then gh pr comment "$FACT_PR" --body "Facts approved. Script ready for review: $pr"; fi
