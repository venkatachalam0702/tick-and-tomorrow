title: How does a microwave work?
wiki: Microwave oven
pillar: How Things Work
created: '2026-11-26'
angle: Demystify microwave cooking by treating the appliance like a high-powered molecular
  agitator that targets water, turning invisible electromagnetic fields into piping-hot
  food in seconds.
key_questions:
- What actually happens inside the box when you press start?
- How does a tiny metal tube called a magnetron turn electricity into invisible waves?
- Why do water molecules care so much about these specific waves?
- How does molecular friction actually create heat?
- Why do some materials get scorching hot while the ceramic plate stays totally cool?
- What is the metal mesh in the glass door doing, and why is it so important for safety?
- Why do microwaves leave certain spots in your food ice cold while other parts boil?
status: gate-2-factcheck
