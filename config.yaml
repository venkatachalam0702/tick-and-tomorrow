# Tick & Tomorrow pipeline settings.
# Free tiers change often: model names and limits live here so a swap is a one-line edit.

gemini:
  # "-latest" aliases follow Google's current Flash / Flash-Lite models.
  # Pin an exact name (e.g. from AI Studio) if an alias ever moves to a paid-only model.
  writer_model: gemini-flash-latest        # facts, script, metadata (free tier ~20 requests/day)
  helper_model: gemini-flash-lite-latest   # small helper jobs (free tier ~500 requests/day)
  # If a model is overloaded (HTTP 503) or rate-limited, retry, then try the next fallback model.
  writer_fallbacks: [gemini-flash-lite-latest]
  helper_fallbacks: []
  max_retries: 4                 # attempts per model
  retry_wait_seconds: 30         # wait grows: 30 s, 60 s, 90 s
  temperature: 0.3

channel:
  name: Tick & Tomorrow
  language: en

topics:
  backlog_file: topics/backlog.yaml
  suggestions_per_issue: 5
  pageview_days: 30

research:
  max_wikipedia_articles: 4
  max_reference_sources: 3        # primary sources taken from Wikipedia's reference links
  max_chars_per_source: 60000
  max_total_chars: 220000
  min_source_chars: 800
  target_claims: "15 to 25"     # enough for a 5-minute video
  # Reference links are only fetched from these kinds of domains (primary/official sources).
  trusted_domain_suffixes:
    - .gov
    - .gov.uk
    - .edu
    - .ac.uk
    - .int
    - nasa.gov
    - esa.int
    - nist.gov
    - who.int
    - ieee.org
    - nature.com
    - science.org
    - britannica.com
    - arxiv.org
  blocked_domains:
    - youtube.com
    - facebook.com
    - x.com
    - twitter.com
    - reddit.com

script:
  # Main video is 5 minutes max (Venkat, 2026-11-26).
  words_min: 600           # about 4 minutes at 150 words a minute
  words_max: 750           # about 5 minutes
  words_per_minute: 150
  hook_max_words: 40       # the hook must fit in the first ~15 seconds
  chapters_min: 2
  chapters_max: 4
  copied_run_words: 10     # a run of this many words copied from a source is flagged
  repair_rounds: 1         # extra Flash call to fix lint errors (budget: ~20 Flash calls/day)
  visual_types: [diagram, photo, illustration, text, same]
  banned_phrases:
    - "in today's video"
    - "without further ado"
    - "smash that like button"
    - "let's dive in"
    - "let's dive into"
    - "buckle up"
    - "in this day and age"
    - "game-changer"
    - "game changer"
    - "mind-blowing"
    - "it's important to note"
    - "it is important to note"
    - "delve"
    - "tapestry"
    - "in conclusion"

voice:
  # Kokoro-82M (Apache 2.0). Comma-separated voices are averaged into one blended voice.
  # Run "4. Voice" with samples=true to hear the candidates, then set your pick here.
  voice: af_heart
  lang_code: a              # a = American English, b = British English
  speed: 1.0
  sample_rate: 24000
  pause_sentence: 0.25      # seconds of silence between sentences
  pause_section: 0.7        # seconds between sections
  loudness_lufs: -14
  caption_max_chars: 42
  candidates:               # rendered by the samples run
    - af_heart
    - af_bella
    - af_heart,af_bella
    - am_michael
    - am_fenrir
    - bf_emma

visuals:
  max_attempts: 3           # per asset: first try + 2 retries after a failed vision check
  min_qa_score: 3           # vision check score 1-5 needed to pass
  plan_batch: 6             # cues planned per Gemini call (smaller = faster, fewer timeouts)
  photo_fallback: illustration   # if no licensed photo passes, draw an illustration instead
